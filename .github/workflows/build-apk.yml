name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install platform + build-tools
        run: |
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          sdkmanager --licenses > /dev/null <<<'y'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: doomscroll-guard-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 'Latest build (installable APK)'
          prerelease: true
          generate_release_notes: false
          body: |
            Automatically built from the latest `main`. Download
            `app-debug.apk` and install it on your Android device
            (allow "install unknown apps" when prompted).

            Signed with the debug key — expected for sideloading.
            See README for the honest capability list and setup guide.
          files: android/app/build/outputs/apk/debug/app-debug.apk
